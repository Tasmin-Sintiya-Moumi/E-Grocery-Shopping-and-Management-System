<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Your Orders</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <a href="index.html" class="logo">Online Grocery Store</a>
    <nav id="navAuth"></nav>
  </header>

  <div class="container">
    <h2>Your Orders</h2>
    <table>
      <thead><tr><th>Order #</th><th>Date</th><th>Total</th><th>Status</th></tr></thead>
      <tbody id="ordersBody"><tr><td colspan="4">Loading...</td></tr></tbody>
    </table>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    requireLogin();
    renderNavAuthArea('navAuth');

    async function loadOrders() {
      const body = document.getElementById('ordersBody');
      try {
        const orders = await Api.getOrders();
        body.innerHTML = orders.length
          ? orders.map(o => `
              <tr>
                <td>#${o.id}</td>
                <td>${new Date(o.created_at).toLocaleDateString()}</td>
                <td>BDT${Number(o.total_amount).toFixed(2)}</td>
                <td>${o.status}</td>
              </tr>`).join('')
          : '<tr><td colspan="4">No orders yet.</td></tr>';
      } catch (e) {
        body.innerHTML = `<tr><td colspan="4" class="error">${e.message}</td></tr>`;
      }
    }
    loadOrders();
  </script>
</body>
</html>
